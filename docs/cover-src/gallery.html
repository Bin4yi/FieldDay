<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AB;src:url(ab.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1280px;overflow:hidden;font-family:AB;background:#000}
.shot{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover}
.bar{position:absolute;left:0;top:1080px;width:1920px;height:200px;border-top:10px solid #000;
 background:repeating-linear-gradient(135deg,#FFE600 0 34px,#ffdd00 34px 68px);display:flex;align-items:center;gap:34px;padding:0 54px}
.n{flex:none;width:118px;height:118px;background:#0B1C3D;color:#FFE600;border:7px solid #000;box-shadow:9px 9px 0 #000;font-size:60px;display:flex;align-items:center;justify-content:center}
.tt{font-size:58px;text-transform:uppercase;line-height:1;color:#000}
.sub{font:700 27px 'DejaVu Sans Mono',monospace;color:#000;margin-top:12px}
.navy{position:absolute;inset:0 0 200px 0;background:repeating-linear-gradient(135deg,#0B1C3D 0 46px,#10244b 46px 92px)}
.phone{position:absolute;top:70px;width:330px;height:730px;border:14px solid #000;border-radius:52px;overflow:hidden;background:#000;box-shadow:18px 20px 0 rgba(0,0,0,.5)}
.phone img{width:100%;display:block}
.lbl{position:absolute;top:840px;font-size:30px;text-transform:uppercase;background:#fff;color:#000;border:5px solid #000;box-shadow:7px 7px 0 #000;padding:8px 14px 5px;white-space:nowrap}
</style></head><body><div id="c"></div>
<script>
const p=new URLSearchParams(location.search);const n=p.get('n'),t=p.get('t'),s=p.get('s'),img=p.get('img');
let h='';
if(img==='screens'){h+='<div class="navy"></div>';
 const ps=[['home','Home'],['say_card','Say a game'],['quests','Quests'],['result_top','Result'],['home_offline','Offline']];
 ps.forEach(([f,l],i)=>{const x=60+i*366;const r=[-3,2,-2,3,-1][i];
  h+=`<div class="phone" style="left:${x}px;transform:rotate(${r}deg)"><img src="${f}.png"></div><div class="lbl" style="left:${x+20}px;transform:rotate(${-r}deg)">${l}</div>`;});
}else h+=`<img class="shot" src="${img}">`;
h+=`<div class="bar"><div class="n">${n}</div><div><div class="tt">${t}</div><div class="sub">${s}</div></div></div>`;
document.getElementById('c').innerHTML=h;
</script></body></html>
