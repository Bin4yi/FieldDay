<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AB;src:url(ab.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1000px;height:420px;overflow:hidden;background:#FFE600;font-family:AB}
.stage{position:relative;width:1000px;height:420px;overflow:hidden;
 background:repeating-linear-gradient(135deg,#FFE600 0 26px,#ffdf00 26px 52px)}
.navy{position:absolute;left:470px;top:-40px;width:620px;height:520px;background:repeating-linear-gradient(135deg,#0B1C3D 0 22px,#10244b 22px 44px);transform:skewX(-8deg);border-left:6px solid #000}
.logo{position:absolute;left:34px;top:30px;display:flex;align-items:center;gap:14px}
.logo img{width:64px;height:64px;border:4px solid #000;border-radius:14px;box-shadow:5px 5px 0 #000}
.logo span{font-size:66px;color:#FFE600;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:6px 6px 0 #000;letter-spacing:-1px}
.st{position:absolute;left:34px;font-size:27px;text-transform:uppercase;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:7px 14px 5px;white-space:nowrap;line-height:1}
.chip{position:absolute;left:34px;top:300px;font:700 15px 'DejaVu Sans Mono',monospace;letter-spacing:.5px;text-transform:uppercase;background:#0B1C3D;color:#FFE600;padding:7px 10px;border:3px solid #000;line-height:1.5;box-shadow:5px 5px 0 #000}
.photo{position:absolute;left:500px;top:44px;width:330px;height:250px;border:5px solid #000;box-shadow:9px 9px 0 #000;transform:rotate(-3deg);overflow:hidden;background:#000}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.ro{position:absolute;left:640px;top:226px;transform:rotate(-3deg);z-index:3;background:#0B1C3D;color:#fff;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:6px 12px 8px}
.ro small{display:block;font:700 11px 'DejaVu Sans Mono',monospace;color:#FFE600;letter-spacing:1px}
.ro b{font-size:34px;font-weight:400}
.ro b i{font-style:normal;font-size:18px;color:#FFE600}
.photo2{position:absolute;left:510px;top:302px;width:180px;height:101px;border:4px solid #000;box-shadow:6px 6px 0 #000;transform:rotate(2deg);overflow:hidden}
.photo2 img{width:100%;height:100%;object-fit:cover}
.phone{position:absolute;width:150px;height:318px;border:7px solid #000;border-radius:24px;overflow:hidden;background:#000;box-shadow:9px 10px 0 rgba(0,0,0,.55)}
.phone img{width:100%;display:block}
.volt{position:absolute;left:345px;top:215px;width:175px;height:175px}
.tag{position:absolute;font-size:16px;text-transform:uppercase;border:3px solid #000;padding:5px 9px 4px;box-shadow:4px 4px 0 #000;white-space:nowrap}
</style></head><body><div class="stage">
<div class="navy"></div>
<div class="logo"><img src="app_icon.png"><span>FIELDDAY</span></div>
<div class="st" style="top:122px;background:#fff;transform:rotate(-1.5deg)">Say any game.</div>
<div class="st" style="top:176px;background:#2BD96B;transform:rotate(1deg)">Play it outside.</div>
<div class="st" style="top:230px;background:#FF4D3D;color:#fff;transform:rotate(-1deg)">Phone = referee.</div>
<div class="chip">● Works offline<br>● Gemma on your phone</div>
<div class="photo"><img src="jump.jpg"></div>
<div class="ro"><small>JUMP HEIGHT · MEASURED</small><b>0.70 <i>m</i></b></div>
<div class="photo2"><img src="boss.jpg"></div>
<div class="phone" style="left:842px;top:22px;transform:rotate(5deg)"><img src="say_card.png"></div>
<div class="phone" style="left:790px;top:160px;transform:rotate(-4deg);width:140px;height:296px"><img src="home_offline.png"></div>
<div class="tag" style="left:700px;top:22px;background:#FF4D3D;color:#fff;transform:rotate(3deg)">Real tracking</div>
<img class="volt" src="volt_cheer.png">
</div></body></html>
